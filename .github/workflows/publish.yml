# Publishes a release when a vX.Y.Z tag is pushed (by `make release-*`).
#
# Signs in to the VS Code Marketplace with trusted publishing (OIDC), so no
# token is stored anywhere. The Marketplace's trusted publishing policy for the
# "prateep" publisher must name this repo and this file, publish.yml.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # trusted publishing to the Marketplace

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: npm test

      - run: npx vsce package -o multi-repo-explorer.vsix

      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --oidc --packagePath multi-repo-explorer.vsix

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '$0 == heading {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" multi-repo-explorer.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md
