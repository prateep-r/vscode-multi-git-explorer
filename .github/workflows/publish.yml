# Publishes a release when a vX.Y.Z tag is pushed (by `make release-*`).
#
# Signs in to the VS Code Marketplace with trusted publishing (OIDC), so no
# token is stored anywhere. The Marketplace's trusted publishing policy for the
# "prateep-r" publisher must name this repo and this file, publish.yml.
#
# Each job gets only the permissions it needs. `build` runs the dependencies'
# install scripts and the tests, so it can't publish or write to the repo.
# `publish` installs from the lockfile without running any install scripts and
# publishes the package `build` made. Actions are pinned to commits, since a
# tag can be moved.
name: Publish

on:
  push:
    tags: ['v*']

permissions: {}

concurrency: publish

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: npm test

      - run: npx vsce package -o multi-git-explorer.vsix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: multi-git-explorer.vsix
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing to the Marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install vsce from the lockfile, without install scripts
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: Publish to the VS Code Marketplace
        run: npx --no-install vsce publish --oidc --packagePath multi-git-explorer.vsix

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '$0 == heading {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" multi-git-explorer.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md
